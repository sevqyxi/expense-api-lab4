name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expenses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # тестові значення лише для CI, справжні секрети в репозиторій не потрапляють
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: expenses_test
      JWT_SECRET_KEY: test-ci-secret-key-not-for-production-0123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply Alembic migrations to test database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/expenses_test
        run: alembic upgrade head

      - name: Run Pytest
        run: pytest --maxfail=1 --disable-warnings -v
